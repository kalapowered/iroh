pkarr_put_rate_limit = "smart"
# Lookups over HTTP (GET /pkarr/{key} and /dns-query): 100 at once and 50 a second for each
# source network, shared by the three routes. DNS over UDP and TCP is not limited here.
lookup_rate_limit = "simple"

[https]
port = 443
domains = ["irohdns.example.org"]
cert_mode = "lets_encrypt"
letsencrypt_prod = true

[dns]
port = 53
default_soa = "dns1.irohdns.example.org hostmaster.irohdns.example.org 0 10800 3600 604800 3600"
default_ttl = 30
origins = ["irohdns.example.org", "."]
rr_a = "203.0.10.10"
rr_ns = "ns1.irohdns.example.org."

[mainline]
enabled = false
